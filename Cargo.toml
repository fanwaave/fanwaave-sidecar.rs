    [package]
    name = "fanwaave-sidecar"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Sidecar for Fanwaave"
    repository = "https://github.com/fanwaave/fanwaave-sidecar.rs"

    [[bin]]
    name = "fanwaave-sidecar"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


